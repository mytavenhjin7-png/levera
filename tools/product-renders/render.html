const metalMat = m => m === 'gold' ? M.gold() : m === 'rose' ? new THREE.MeshPhysicalMaterial({ color: '#E2A88E', metalness: 1, roughness: .17 }) : m === 'white' ? new THREE.MeshPhysicalMaterial({ color: '#E4E6EA', metalness: 1, roughness: .12 }) : M.silver();

}
function cap(p) {

  const top = M.leather(new THREE.Color(p.color).multiplyScalar(.9), .02); top.roughness = .75; top.clearcoat = 0; top.envMapIntensity = .15;

function necklace(p) {

  const n = 70; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const l = mesh(new THREE.TorusGeometry(.04, .012, 8, 20), mm, Math.cos(a) * .8, .02, Math.sin(a) * .6 - .1); l.rotation.y = -a; l.rotation.x = i % 2 ? Math.PI / 2 : 0; g.add(l); }
  const pend = new THREE.Group();
  pend.add(mesh(rbox(.12, .5, .05, .02), mm, 0, 0, 0)); pend.add(mesh(rbox(.36, .12, .05, .02), mm, 0, .08, 0));
  pend.rotation.x = -Math.PI / 2; pend.position.set(0, .04, .72); g.add(pend);
  return { obj: g, pose: { yaw: 0, elev: .9, fov: 22, pad: 1.05 } };

function watch(p) {
  const g = new THREE.Group(); const mm = metalMat(p.metal || 'silver');
  const strap = p.color === '#18181A' ? M.leather('#18181A', .3) : mm;
  const band = mesh(new THREE.TorusGeometry(.58, .07, 16, 120), strap, 0, .58, 0); band.rotation.y = Math.PI / 2; band.scale.set(1, 1, 2.6); g.add(band);

  const crown = mesh(new THREE.CylinderGeometry(.04, .04, .06, 16), M.matte('#1d3a8a'), .31, .58, .62); crown.rotation.z = Math.PI / 2; g.add(crown);
  return { obj: g, pose: { yaw: -.55, elev: .16, fov: 22, pad: 1.05 } };

function lipstick(p) {
  const g = new THREE.Group();
  const shade = new THREE.MeshPhysicalMaterial({ color: p.color, roughness: .3, clearcoat: .6 });
  if (p.beauty) { g.add(mesh(rbox(.7, 1.1, .7, .08), new THREE.MeshPhysicalMaterial({ color: p.color, roughness: .2, clearcoat: 1 }), 0, .55, 0)); g.add(mesh(new THREE.CylinderGeometry(.3, .3, .3, 64), M.gold(), 0, 1.25, 0)); return { obj: g, pose: { yaw: -.4, elev: .14, fov: 22, pad: 1.1 } }; }
  g.add(mesh(new THREE.CylinderGeometry(.26, .26, .9, 64), M.gold(), -.3, .45, 0));

/* ---------- loaded models ---------- */
const gltfL = new GLTFLoader();
const load = u => new Promise((res, rej) => gltfL.load(u, res, undefined, rej));
let SHOE, GLASSES;
const GREY = new Map();
function greyTex(t) {
  if (!t || !t.image) return t;
  if (GREY.has(t.uuid)) return GREY.get(t.uuid);
  const img = t.image, c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
  for (let i = 0; i < a.length; i += 4) { const l = .3 * a[i] + .59 * a[i + 1] + .11 * a[i + 2]; const v = Math.min(255, 70 + l * .85); a[i] = a[i + 1] = a[i + 2] = v; }
  g.putImageData(d, 0, 0);
  const nt = new THREE.CanvasTexture(c); nt.colorSpace = t.colorSpace; nt.flipY = t.flipY; nt.wrapS = t.wrapS; nt.wrapT = t.wrapT; nt.channel = t.channel;
  GREY.set(t.uuid, nt); return nt;
}
async function shoeVariant(v, tint) {
  const root = SHOE.scene.clone(true); const jobs = [];
  root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; jobs.push(SHOE.parser.getDependency('material', v).then(m => { const mm = m.clone(); if (tint) { mm.map = greyTex(mm.map); mm.color.set(tint); } o.material = mm; })); } });
  await Promise.all(jobs); return root;
}
async function shoe(p) { const o = await shoeVariant(p.v, p.tint); return { obj: o, pose: { yaw: p.yaw, elev: .14, fov: 22, pad: 0.96 } }; }
function glasses() {
  const o = GLASSES.scene.clone(true); o.traverse(x => { if (x.isMesh) { x.castShadow = true; } });
  const g = new THREE.Group(); g.add(o);
  return { obj: g, pose: { yaw: -.5, elev: .2, fov: 22, pad: 1.09 } };
}

/* ---------- frame + shoot ---------- */
function place(obj, targetSize) {
  const holder = new THREE.Group(); holder.add(obj); scene.add(holder); holder.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(holder); const s = box.getSize(new THREE.Vector3());
  holder.scale.setScalar(targetSize / Math.max(s.x, s.y, s.z)); holder.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(holder); const c = box.getCenter(new THREE.Vector3());
  holder.position.x -= c.x; holder.position.z -= c.z; holder.position.y -= box.min.y; holder.updateMatrixWorld(true);
  return holder;
}
function shoot(holder, pose) {
  holder.rotation.y = pose.yaw; holder.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(holder), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  cam.fov = pose.fov; cam.updateProjectionMatrix();
  const vfov = THREE.MathUtils.degToRad(cam.fov), hfov = 2 * Math.atan(Math.tan(vfov / 2) * cam.aspect);
  const dist = sphere.radius * pose.pad / Math.sin(Math.min(vfov, hfov) / 2);
  cam.position.set(c.x, c.y + Math.sin(pose.elev) * dist, c.z + Math.cos(pose.elev) * dist);
  cam.lookAt(c.x, c.y - size.y * .04, c.z);
  ao.scale.set(size.x * 1.25, size.z * 1.4 + .2, 1); ao.position.set(c.x, .002, c.z);
  renderer.render(scene, cam);
  return canvas.toDataURL('image/jpeg', .86);
}

const MAKERS = { flacon, fold, duffel, handbag, backpack, bangle, ring, cap, beanie, shoe, glasses, wallet, belt, necklace, watch, lipstick };
const SIZE = { flacon: 1.6, fold: 2.2, shoe: 2.4, glasses: 2.2, duffel: 2.4, handbag: 1.8, backpack: 1.8, bangle: 1.6, ring: 1.3, cap: 2.3, beanie: 1.5, wallet: 1.7, belt: 1.7, necklace: 1.9, watch: 1.5, lipstick: 1.5 };
const small = document.createElement('canvas'); small.width = 600; small.height = 750;
let envReady = null;
async function initEnv() {
  const hdr = await new HDRLoader().loadAsync('models/studio_small_03_1k.hdr');
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(hdr).texture; scene.environmentIntensity = .8;
  SHOE = await load('models/shoe.glb'); GLASSES = await load('models/sunglasses.glb');
}
/* items: [{ id, kind, p }] -> { id: webp data URL (600x750) } */
window.renderItems = async (items) => {
  await (envReady ||= initEnv());
  const out = {};
  for (const item of items) {
    try {
      const made = await MAKERS[item.kind](item.p || {});
      const holder = place(made.obj, SIZE[item.kind]);
      shoot(holder, made.pose); scene.remove(holder);
      small.getContext('2d').drawImage(canvas, 0, 0, 600, 750);
      out[item.id] = small.toDataURL('image/webp', .8);
    } catch (e) { out[item.id] = 'ERR ' + e.message; }
  }
  return out;
};
window.renderAll = async (only) => {
  const hdr = await new HDRLoader().loadAsync('models/studio_small_03_1k.hdr');
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(hdr).texture; scene.environmentIntensity = .8;
  SHOE = await load('models/shoe.glb'); GLASSES = await load('models/sunglasses.glb');
  const cat = await (await fetch('catalog.json')).json();
  const out = {};
  for (const item of cat) {
    if (only && !only.includes(item.id)) continue;
    const made = await MAKERS[item.kind](item.p || {});
    const size = { flacon: 1.6, fold: 2.2, shoe: 2.4, glasses: 2.2, duffel: 2.4, handbag: 1.8, backpack: 1.8, bangle: 1.6, ring: 1.3, cap: 2.3, beanie: 1.5 }[item.kind];
    const holder = place(made.obj, size);
    out[item.id] = shoot(holder, made.pose);
    scene.remove(holder);
  }
  return out;
};
window.ready = true;
