<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEVERA Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>
  html,body{background:var(--bg);min-height:100%}
  .a-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:24px;padding:14px var(--gutter);background:rgba(239,237,232,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .a-top .logo{font-size:22px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tabs button{height:36px;padding:0 14px;border-radius:999px;border:1px solid transparent;background:none;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--mute)}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
  .a-top .sp{flex:1}
  .a-main{padding:28px var(--gutter) 80px;max-width:1500px;margin:0 auto}
  h1.a-h{font-family:var(--display);font-weight:400;font-size:40px;margin:0 0 20px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px}
  .stat{background:var(--card);border:1px solid var(--line);padding:18px}
  .stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;margin-top:6px}
  .stat .mono,.muted{color:var(--mute)}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  textarea{width:100%;font-family:var(--mono);font-size:12px}
  .btn-s{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  .btn-s.ghost{background:transparent;color:var(--ink)}
  .btn-s:disabled{opacity:.4}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);background:var(--bg-2)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td input{width:84px;padding:5px 7px}
  td input.w{width:60px} td input.url{width:150px}
  td img{width:46px;height:58px;object-fit:cover;background:#E5E2DB;display:block}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;background:#E5E2DB}
  .tag.manual{background:#D7EBDD;color:#1E5A33}
  .tag.paid{background:#D7EBDD;color:#1E5A33} .tag.unpaid{background:#F4E0D6;color:#8A3B1E}
  tr.dirty td{background:#FBF4E4}
  .pager{display:flex;gap:10px;align-items:center;margin-top:14px}
  .card-a{background:var(--card);border:1px solid var(--line);padding:22px;margin-bottom:18px}
  .card-a h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:26px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
  .fields label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute)}
  .order{background:var(--card);border:1px solid var(--line);margin-bottom:12px}
  .order summary{display:grid;grid-template-columns:110px 150px 1fr 120px 110px 170px;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;list-style:none;font-size:13px}
  .order summary::-webkit-details-marker{display:none}
  .order .body{padding:4px 16px 16px;border-top:1px solid var(--line)}
  .order .it{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);padding:32px;display:flex;flex-direction:column;gap:14px}
  .msg{font-size:13px;margin:8px 0 0}.msg.err{color:#A3352B}.msg.ok{color:#1E5A33}
  @media (max-width:900px){.order summary{grid-template-columns:1fr 1fr}}
  .tbl-wrap{overflow:auto}
</style>
</head>
<body>
<div id="app"></div>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
