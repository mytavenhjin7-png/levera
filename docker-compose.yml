# LEVERA on one server (VPS): the shop + MySQL.
#   1. copy .env.production.example to .env and fill it in
#   2. docker compose up -d --build
# The shop loads data/levera-seed.sql into the empty database on its first start.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: levera
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_DRIVER: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_DATABASE: levera
    ports:
      - "8787:8787"
    # the photos (uploads/) and the seed file (data/) come from this folder, so they are there from the start
    # and anything uploaded in admin survives rebuilds
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

volumes:
  mysql:
